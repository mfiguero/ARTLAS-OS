# AR.T.L.A.S. OS · construye las imágenes del sistema (ISO amd64 y Raspberry Pi arm64).
# La fuente puede estar descomprimida en el repositorio o subida como ARTLAS-OS-vXX-fuente.zip (se descomprime sola).
# Se lanza a mano: Actions → «Imágenes AR.T.L.A.S. OS» → Run workflow. Duración: 40–120 min según la imagen.
name: Imágenes AR.T.L.A.S. OS
on:
  workflow_dispatch:
    inputs:
      objetivo:
        description: "Qué imagen construir"
        type: choice
        options: [ambas, iso, raspberry]
        default: ambas
      rama_pigen:
        description: "Rama de pi-gen (arm64 o master)"
        default: arm64

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir la fuente si se subió como .zip
        run: |
          # elige el .zip de la versión más alta según SU artlas.config.json (no por el nombre: v761 > v77 al ordenar texto)
          Z=$(python3 - <<'PY'
          import glob, json, re, zipfile
          best = None
          for f in glob.glob("ARTLAS-OS-*fuente*.zip"):
              try: v = json.loads(zipfile.ZipFile(f).read("artlas.config.json"))["ver"]
              except Exception: continue
              k = tuple(int(x) for x in re.findall(r"\d+", v))
              if best is None or k > best[0]: best = (k, f)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$Z" ]; then unzip -o -q "$Z" && echo "Fuente tomada de $Z"; fi
          test -f build.mjs || { echo "::error::Falta la fuente: subí ARTLAS-OS-vXX-fuente.zip al repositorio"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: artlas-dist
          path: |
            dist/web-only
            dist/nucleo
            dist/rag
          retention-days: 3

  iso:
    needs: app
    if: ${{ inputs.objetivo == 'ambas' || inputs.objetivo == 'iso' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir la fuente si se subió como .zip
        run: |
          # elige el .zip de la versión más alta según SU artlas.config.json (no por el nombre: v761 > v77 al ordenar texto)
          Z=$(python3 - <<'PY'
          import glob, json, re, zipfile
          best = None
          for f in glob.glob("ARTLAS-OS-*fuente*.zip"):
              try: v = json.loads(zipfile.ZipFile(f).read("artlas.config.json"))["ver"]
              except Exception: continue
              k = tuple(int(x) for x in re.findall(r"\d+", v))
              if best is None or k > best[0]: best = (k, f)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$Z" ]; then unzip -o -q "$Z" && echo "Fuente tomada de $Z"; fi
          test -f build.mjs || { echo "::error::Falta la fuente: subí ARTLAS-OS-vXX-fuente.zip al repositorio"; exit 1; }
      - name: Liberar espacio en el disco del runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/download-artifact@v4
        with: { name: artlas-dist, path: dist }
      - name: Construir la ISO (live-build en un contenedor Debian 13)
        run: sudo ARTLAS_SALIDA=$PWD/imagen/salida bash imagen/iso/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ARTLAS-OS-iso-amd64
          path: imagen/salida/*amd64.iso*
          compression-level: 0
          if-no-files-found: error

  raspberry:
    needs: app
    if: ${{ inputs.objetivo == 'ambas' || inputs.objetivo == 'raspberry' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir la fuente si se subió como .zip
        run: |
          # elige el .zip de la versión más alta según SU artlas.config.json (no por el nombre: v761 > v77 al ordenar texto)
          Z=$(python3 - <<'PY'
          import glob, json, re, zipfile
          best = None
          for f in glob.glob("ARTLAS-OS-*fuente*.zip"):
              try: v = json.loads(zipfile.ZipFile(f).read("artlas.config.json"))["ver"]
              except Exception: continue
              k = tuple(int(x) for x in re.findall(r"\d+", v))
              if best is None or k > best[0]: best = (k, f)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$Z" ]; then unzip -o -q "$Z" && echo "Fuente tomada de $Z"; fi
          test -f build.mjs || { echo "::error::Falta la fuente: subí ARTLAS-OS-vXX-fuente.zip al repositorio"; exit 1; }
      - name: Liberar espacio en el disco del runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Emulación arm64 (qemu)
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static binfmt-support
      - uses: actions/download-artifact@v4
        with: { name: artlas-dist, path: dist }
      - name: Construir la imagen para Raspberry Pi (pi-gen)
        run: sudo PIGEN_RAMA=${{ inputs.rama_pigen }} ARTLAS_SALIDA=$PWD/imagen/salida bash imagen/rpi/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ARTLAS-OS-raspberrypi-arm64
          path: imagen/salida/*raspberrypi*
          compression-level: 0
          if-no-files-found: error
